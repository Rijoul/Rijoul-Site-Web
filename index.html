<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loup-Garou — Le Village Endormi</title>
<meta name="description" content="Loup-Garou à un seul appareil : distribution des rôles, nuits, votes et narration vocale automatique pour animer vos parties entre amis.">
<meta name="theme-color" content="#06070C">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BA%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif;
    --font-text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Cascadia Code', monospace;

    --ink:#F5F5F7;
    --ink-dim:#E4E4EA;
    --muted:#B8B8C4;
    --muted-2:#87879199;
    --muted-2-solid:#87879a;

    /* Matériau verre — surfaces translucides façon Liquid Glass */
    --glass:rgba(255,255,255,0.10);
    --glass-strong:rgba(255,255,255,0.16);
    --glass-border:rgba(255,255,255,0.32);
    --glass-border-soft:rgba(255,255,255,0.16);
    --glass-highlight:rgba(255,255,255,0.55);

    --panel:var(--glass);
    --panel-strong:var(--glass-strong);
    --border:var(--glass-border-soft);
    --border-strong:var(--glass-border);
    --hairline:rgba(255,214,10,0.4);

    /* Teintes système iOS, réattribuées aux camps du jeu */
    --wolf:#FF453A;
    --wolf-bright:#FF6961;
    --village:#FFD60A;
    --village-bright:#FFE066;
    --seer:#BF5AF2;
    --witch:#32D74B;
    --hunter:#FF9F0A;
    --cupid:#FF375F;

    --bg1:#05060f;
    --bg2:#1c1440;
    --bg3:#3a1750;
    --radius-sm:14px;
    --radius:22px;
    --radius-lg:30px;
    --shadow-sm: 0 2px 14px rgba(0,0,0,0.25);
    --shadow-md: 0 18px 46px -14px rgba(0,0,0,0.55), 0 2px 10px rgba(0,0,0,0.25);
    --shadow-lg: 0 32px 80px -20px rgba(0,0,0,0.65), 0 6px 18px rgba(0,0,0,0.3);
    --shadow-gold: 0 12px 30px -10px rgba(255,214,10,0.5);
    --shadow-wolf: 0 12px 30px -10px rgba(255,69,58,0.5);
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --transition-slow: 900ms cubic-bezier(.4,0,.2,1);
    --transition: 220ms cubic-bezier(.4,0,.2,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font-text);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 65% 45% at 15% 0%, rgba(191,90,242,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% 8%, rgba(255,55,95,0.22) 0%, transparent 55%),
      radial-gradient(ellipse 70% 55% at 50% 100%, rgba(10,132,255,0.28) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 55%, #020208 100%);
    transition: background var(--transition-slow);
    overflow-x:hidden;
    position:relative;
  }
  body.is-day{
    background:
      radial-gradient(ellipse 65% 45% at 85% 0%, rgba(255,214,10,0.35) 0%, transparent 58%),
      radial-gradient(ellipse 60% 45% at 10% 5%, rgba(255,159,10,0.28) 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,55,95,0.24) 0%, transparent 60%),
      linear-gradient(180deg, #2a1a4a 0%, #6b2560 34%, #b9435c 62%, #3a1a34 100%);
  }
  /* Grain léger + vignette : garde une texture de matière sous le verre, en très discret */
  body::after{
    content:''; position:fixed; inset:0; z-index:6; pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
    mix-blend-mode:overlay; opacity:.035;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(ellipse 120% 90% at 50% 20%, transparent 40%, rgba(0,0,0,0.4) 100%);
  }
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0; transition:opacity var(--transition-slow);}
  body.is-day .stars{opacity:0;}
  .star{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  #app{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:76px 20px 96px; min-height:100vh; display:flex; flex-direction:column; align-items:stretch;}

  .app-enter{animation: appEnter 460ms var(--ease-out);}
  @keyframes appEnter{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0 0 6px; letter-spacing:-.02em;}
  .title-main{
    font-size:clamp(2.1rem, 7vw, 2.7rem); text-align:center; letter-spacing:-.02em; line-height:1.05; font-weight:800;
    background:linear-gradient(180deg, #ffffff 0%, #d8d8e6 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .title-main .accent{
    background:linear-gradient(135deg, var(--wolf-bright) 0%, var(--cupid) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{
    text-align:center; color:var(--muted); font-size:.95rem; margin-bottom:8px; letter-spacing:0;
    font-family:var(--font-text); font-style:normal; font-weight:500; max-width:420px; margin-left:auto; margin-right:auto;
  }
  .subtitle .small{display:block; margin-top:8px; font-family:var(--font-mono); font-style:normal; font-size:.66rem; letter-spacing:.06em; color:var(--muted-2-solid); text-transform:uppercase;}
  .subtitle + .subtitle, .subtitle{margin-bottom:30px;}

  .narrative{font-family:var(--font-text); font-style:normal; color:var(--muted); line-height:1.65;}

  .eyebrow{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2-solid);}
  .eyebrow.on-accent{color:var(--role-accent, var(--village-bright));}

  /* Barre de statut persistante — pilule de verre façon Dynamic Island */
  .status-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 18px; margin-bottom:24px;
    background:rgba(20,20,30,0.45); border:1px solid var(--glass-border-soft); border-radius:999px;
    backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.14), inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .status-bar .status-phase{display:flex; align-items:center; gap:9px; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);}
  .status-bar .status-dot{width:7px; height:7px; border-radius:50%; background:var(--village-bright); box-shadow:0 0 8px 1px var(--village-bright); animation:dotPulse 2.4s ease-in-out infinite;}
  @keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  body.is-day .status-bar .status-dot{background:#FFD60A; box-shadow:0 0 8px 1px #FFD60A;}
  .status-bar .status-alive{
    font-family:var(--font-mono); font-size:.72rem; color:var(--muted); display:flex; align-items:center; gap:6px;
    padding-left:12px; border-left:1px solid var(--glass-border-soft);
  }

  /* Élément signature : l'astre jour/nuit, en verre liquide flottant */
  .sky{display:flex; flex-direction:column; align-items:center; margin:8px 0 22px;}
  .celestial{
    width:72px; height:72px; border-radius:50%; position:relative; margin-bottom:16px;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(226,232,255,0.5) 40%, rgba(140,150,200,0.25) 100%);
    backdrop-filter:blur(4px);
    box-shadow: 0 0 34px 6px rgba(191,90,242,0.35), inset 0 1px 1px rgba(255,255,255,0.8), inset -8px -8px 18px rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.4);
    transition: background var(--transition-slow), box-shadow var(--transition-slow);
  }
  .celestial::before{
    content:''; position:absolute; inset:-15px; border-radius:50%;
    border:1.5px dashed rgba(255,255,255,0.25);
    animation: astrolabeSpin 70s linear infinite;
  }
  .celestial::after{
    content:''; position:absolute; inset:-27px; border-radius:50%;
    border:1px dotted rgba(255,255,255,0.14);
    animation: astrolabeSpinRev 130s linear infinite;
  }
  body.is-day .celestial::before{border-color:rgba(255,214,10,0.45);}
  body.is-day .celestial::after{border-color:rgba(255,214,10,0.25);}
  @keyframes astrolabeSpin{ to{ transform:rotate(360deg); } }
  @keyframes astrolabeSpinRev{ to{ transform:rotate(-360deg); } }
  body.is-day .celestial{
    background: radial-gradient(circle at 32% 28%, #fff8e0 0%, #ffd65e 40%, #ff9f0a 100%);
    box-shadow: 0 0 48px 10px rgba(255,159,10,0.45), inset 0 1px 1px rgba(255,255,255,0.7), inset -8px -8px 18px rgba(120,50,10,0.2);
  }
  .crater{position:absolute; border-radius:50%; background:rgba(0,0,0,0.12); transition:opacity var(--transition-slow);}
  .c1{width:13px;height:13px; top:13px; left:17px;}
  .c2{width:8px;height:8px; top:36px; left:42px;}
  .c3{width:6px;height:6px; top:19px; left:46px;}
  body.is-day .crater{opacity:0;}
  .phase-label{font-family:var(--font-mono); font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}

  .panel{
    position:relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, var(--glass) 100%);
    backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border-soft); border-radius:var(--radius); padding:22px;
    margin-bottom:16px; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .panel-strong{background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, var(--glass-strong) 100%); border-color:var(--glass-border);}
  .panel-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px;}
  .panel-title h3{margin:0;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .stack{display:flex; flex-direction:column; gap:12px;}

  input[type=text], input[type=number]{
    background:rgba(255,255,255,0.08); border:1px solid var(--glass-border-soft); color:var(--ink);
    border-radius:16px; padding:13px 16px; font-family:var(--font-text); font-size:.95rem; width:100%;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition: border-color var(--transition), background var(--transition);
  }
  input[type=text]:focus, input[type=number]:focus{outline:2px solid #0A84FF; outline-offset:1px; background:rgba(255,255,255,0.12);}
  input[type=text]::placeholder{color:var(--muted-2-solid);}

  button{font-family:var(--font-text); cursor:pointer; border:none; border-radius:999px; transition:transform .15s ease, background .2s ease, opacity .2s ease, box-shadow .2s ease, border-color .2s ease;}
  button:focus-visible{outline:2px solid #0A84FF; outline-offset:2px;}
  button:active{transform:scale(0.96);}
  .btn-primary{
    position:relative; overflow:hidden;
    background: linear-gradient(180deg, var(--village-bright) 0%, var(--village) 100%);
    color:#241a00; font-weight:600; padding:16px 20px; font-size:1rem; width:100%;
    box-shadow: var(--shadow-gold), inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -2px 4px rgba(0,0,0,0.08);
    letter-spacing:0;
  }
  .btn-primary:disabled{opacity:.32; cursor:not-allowed; box-shadow:none;}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px); box-shadow: 0 16px 36px -10px rgba(255,214,10,0.6), inset 0 1px 0 rgba(255,255,255,0.6);}
  .btn-ghost{
    background:rgba(255,255,255,0.08); border:1px solid var(--glass-border-soft); color:var(--ink); padding:12px 16px; font-size:.86rem; letter-spacing:0;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.15); border-color:var(--glass-border);}
  .btn-ghost:disabled{opacity:.35; cursor:not-allowed;}
  .btn-danger{
    background: linear-gradient(180deg, var(--wolf-bright) 0%, var(--wolf) 100%);
    color:#3a0805; font-weight:600; padding:16px 20px; width:100%;
    box-shadow: var(--shadow-wolf), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn-danger:hover{transform:translateY(-1px); box-shadow: 0 16px 36px -10px rgba(255,69,58,0.65), inset 0 1px 0 rgba(255,255,255,0.4);}
  .btn-danger:disabled{opacity:.32; cursor:not-allowed; box-shadow:none;}
  .btn-small{padding:7px 12px; font-size:.78rem; background:var(--glass-strong); color:var(--ink); border:1px solid var(--glass-border-soft); font-family:var(--font-mono); letter-spacing:.02em; text-transform:uppercase; backdrop-filter:blur(10px);}
  .btn-round{width:34px; height:34px; border-radius:50%; background:var(--glass-strong); color:var(--ink); border:1px solid var(--glass-border-soft); font-size:1.1rem; line-height:1; backdrop-filter:blur(10px); transition:background var(--transition), border-color var(--transition);}
  .btn-round:hover{background:rgba(255,255,255,0.22); border-color:var(--glass-border);}
  .btn-link{background:none; color:var(--muted); text-decoration:underline; text-underline-offset:3px; padding:4px; font-size:.85rem; border-radius:6px;}
  .btn-link:hover{color:var(--ink);}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper .val{width:26px; text-align:center; font-family:var(--font-mono); font-weight:600;}

  .role-tag{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; padding:6px 12px; border-radius:999px; border:1px solid; backdrop-filter:blur(10px);}
  .tag-loup{color:#FFB4AD; border-color:var(--wolf); background:rgba(255,69,58,0.18);}
  .tag-village{color:#FFEB99; border-color:var(--village); background:rgba(255,214,10,0.16);}
  .tag-seer{color:#E3BFFB; border-color:var(--seer); background:rgba(191,90,242,0.18);}
  .tag-witch{color:#A6F5B8; border-color:var(--witch); background:rgba(50,215,75,0.16);}
  .tag-hunter{color:#FFD199; border-color:var(--hunter); background:rgba(255,159,10,0.18);}
  .tag-cupid{color:#FFB0C4; border-color:var(--cupid); background:rgba(255,55,95,0.18);}
  .tag-assassin{color:#D9D0FF; border-color:#8E8CFF; background:rgba(142,140,255,0.18);}

  .player-list{display:flex; flex-direction:column; gap:8px;}
  .player-item{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px 12px 18px; border-radius:18px;
    background:var(--glass); border:1px solid var(--glass-border-soft);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    cursor:pointer; transition:background var(--transition), border-color var(--transition), transform var(--transition);
  }
  .player-item::before{
    content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px;
    background:var(--row-accent, transparent); opacity:0; transition:opacity var(--transition);
  }
  .player-item:hover{background:var(--glass-strong); transform:translateX(2px);}
  .player-item:hover::before{opacity:.9;}
  .player-item:focus-visible{outline:2px solid #0A84FF; outline-offset:2px;}
  .player-item.selected{border-color:var(--village); background:rgba(255,214,10,0.14); box-shadow: 0 0 0 1px rgba(255,214,10,0.3), inset 0 1px 0 rgba(255,255,255,0.2);}
  .player-item.selected::before{background:var(--village-bright); opacity:1;}
  .player-item.dead{opacity:.4; cursor:default; filter:grayscale(.4);}
  .player-item.dead:hover{background:var(--glass); transform:none;}
  .player-item.dead:hover::before{opacity:0;}
  .player-item.dead .player-name{text-decoration:line-through;}
  .player-item[style*="--row-accent"]::before{opacity:.8;}
  .player-main{display:flex; align-items:center; gap:11px; min-width:0;}
  .player-avatar{
    flex:none; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06));
    border:1px solid var(--glass-border);
    font-family:var(--font-mono); font-size:.66rem; font-weight:600; color:var(--muted);
    letter-spacing:.02em;
  }
  .player-item.selected .player-avatar{border-color:var(--village); color:var(--village-bright);}
  .player-name{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .player-meta{color:var(--muted-2-solid); font-size:.74rem; font-family:var(--font-mono); flex:none; letter-spacing:.02em;}

  .role-card{text-align:center; padding:42px 26px 32px; overflow:hidden;}
  .role-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--role-accent, var(--village));
    box-shadow:0 0 16px var(--role-accent, var(--village));
  }
  .role-card::after{
    content:''; position:absolute; inset:10px; border-radius:calc(var(--radius) - 6px);
    border:1px solid color-mix(in srgb, var(--role-accent, var(--village)) 30%, transparent);
    pointer-events:none;
  }
  .role-card-eyebrow{font-family:var(--font-mono); font-size:.64rem; letter-spacing:.22em; text-transform:uppercase; color:var(--role-accent, var(--muted)); opacity:.85; margin-bottom:18px;}
  .role-icon-badge{
    width:92px; height:92px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; position:relative;
    background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--role-accent, var(--village)) 45%, white 8%), transparent 70%), rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border:1px solid color-mix(in srgb, var(--role-accent, var(--village)) 70%, white 15%);
    box-shadow: 0 0 36px -4px var(--role-accent, var(--village)), inset 0 1px 1px rgba(255,255,255,0.5);
  }
  .role-icon-badge::before{
    content:''; position:absolute; inset:-9px; border-radius:50%;
    border:1px dashed color-mix(in srgb, var(--role-accent, var(--village)) 50%, transparent);
  }
  .role-icon{font-size:2.6rem; display:block;}
  .role-name{font-size:2rem; margin-bottom:10px; font-weight:800;}
  .role-desc{font-family:var(--font-text); font-style:normal; color:var(--muted); font-size:1rem; line-height:1.65; max-width:420px; margin:14px auto 0;}

  .pass-screen{text-align:center; padding:64px 22px;}
  .pass-screen .small{font-family:var(--font-text); font-style:normal; font-size:.98rem; color:var(--muted);}
  .pass-icon{font-size:2.5rem; margin-bottom:16px; opacity:.9; filter:drop-shadow(0 4px 14px rgba(0,0,0,0.35));}
  .pass-name{font-size:1.7rem; font-family:var(--font-display); font-weight:800; color:var(--village-bright); margin:8px 0 18px;}
  .auto-progress{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:22px;}
  .auto-progress .dot{width:7px; height:7px; border-radius:50%; background:var(--village-bright); animation:autoDot 1.3s ease-in-out infinite;}
  .auto-progress .dot:nth-child(2){animation-delay:.18s;}
  .auto-progress .dot:nth-child(3){animation-delay:.36s;}
  @keyframes autoDot{0%,80%,100%{opacity:.25; transform:translateY(0);}40%{opacity:1; transform:translateY(-4px);}}

  .badge-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px;}

  .divider{height:1px; background:linear-gradient(90deg, transparent, var(--glass-border-soft) 15%, var(--glass-border-soft) 85%, transparent); margin:18px 0;}
  .divider.gold{background:linear-gradient(90deg, transparent, var(--hairline) 15%, var(--hairline) 85%, transparent);}

  .log-entry{padding:12px 0; border-bottom:1px solid var(--glass-border-soft); font-size:.88rem; color:var(--muted); line-height:1.55; display:flex; gap:10px;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry b{color:var(--ink); font-weight:600;}
  .log-round{flex:none; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.04em; color:var(--muted-2-solid); padding-top:2px; min-width:38px;}

/* ============================= CONTEXTE AUDIO PARTAGÉ (SFX + musique) ============================= */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _audioCtx = new AC();
  }
  if(_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

/* ============================= MOTEUR SONORE (Web Audio, 100% synthétisé) ============================= */
const SFX = (function(){
  let enabled = true;

  function tone({freq=440, freqEnd=null, type='sine', duration=0.2, gain=0.20, attack=0.012, release=0.08, delay=0}){
    if(!enabled) return;
    const c = getAudioCtx();
    if(!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration + release);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration + release + 0.02);
  }

  function noiseBurst({duration=0.3, gain=0.26, delay=0, filterFreq=1200, filterType='lowpass'}){
    if(!enabled) return;
    const c = getAudioCtx();
    if(!c) return;
    const t0 = c.currentTime + delay;
    const size = Math.max(1, Math.floor(c.sampleRate*duration));
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1 - i/size);
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = filterType; filter.frequency.value = filterFreq;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter); filter.connect(g); g.connect(c.destination);
    src.start(t0);
  }

  return {
    setEnabled(v){ enabled = v; },
    isEnabled(){ return enabled; },

    click(){ tone({freq:640, type:'sine', duration:.035, gain:.11, release:.03}); },

    gameStart(){
      tone({freq:220, type:'sine', duration:.28, gain:.20});
      tone({freq:330, type:'sine', duration:.4, gain:.17, delay:.16});
      tone({freq:440, type:'sine', duration:.5, gain:.13, delay:.3});
    },
    chimeReveal(){
      tone({freq:660, type:'sine', duration:.18, gain:.18});
      tone({freq:990, type:'sine', duration:.24, gain:.14, delay:.09});
    },
    howl(){
      tone({freq:180, freqEnd:520, type:'sawtooth', duration:.85, gain:.15, attack:.16, release:.4});
      tone({freq:95, type:'sine', duration:.85, gain:.12, attack:.12, release:.4});
    },
    growl(){
      noiseBurst({duration:.35, gain:.22, filterFreq:280});
      tone({freq:75, type:'sawtooth', duration:.35, gain:.17});
    },
    mystic(){
      tone({freq:880, type:'sine', duration:.3, gain:.16});
      tone({freq:1320, type:'sine', duration:.3, gain:.13, delay:.1});
      tone({freq:1760, type:'sine', duration:.35, gain:.10, delay:.2});
    },
    bubble(){
      for(let i=0;i<5;i++) tone({freq:300+Math.random()*420, type:'sine', duration:.09, gain:.11, delay:i*.06, release:.05});
    },
    sparkle(){
      for(let i=0;i<6;i++) tone({freq:760+i*150, type:'triangle', duration:.14, gain:.10, delay:i*.045, release:.06});
    },
    dawn(){
      tone({freq:520, type:'sine', duration:.35, gain:.16});
      tone({freq:660, type:'sine', duration:.35, gain:.14, delay:.16});
      tone({freq:784, type:'sine', duration:.55, gain:.13, delay:.32});
    },
    deathToll(){
      tone({freq:220, type:'sine', duration:.6, gain:.20, release:.55});
      tone({freq:110, type:'sine', duration:.7, gain:.16, delay:.06, release:.6});
    },
    heartbreak(){ tone({freq:460, freqEnd:190, type:'sine', duration:.35, gain:.16, release:.3}); },
    voteTick(){ noiseBurst({duration:.14, gain:.14, filterFreq:2600}); tone({freq:340, type:'square', duration:.1, gain:.10}); },
    elimination(){ tone({freq:210, freqEnd:55, type:'sawtooth', duration:.5, gain:.20, release:.4}); },
    gunshot(){ noiseBurst({duration:.12, gain:.34, filterFreq:4200, filterType:'highpass'}); tone({freq:140, type:'square', duration:.08, gain:.20}); },
    victoryVillage(){ [523,659,784,1047].forEach((f,i)=>tone({freq:f, type:'triangle', duration:.35, gain:.18, delay:i*.14, release:.2})); },
    victoryLoups(){ [220,196,174,146].forEach((f,i)=>tone({freq:f, type:'sawtooth', duration:.5, gain:.16, delay:i*.18, release:.25})); },
    victoryLovers(){ [660,880,660,990].forEach((f,i)=>tone({freq:f, type:'sine', duration:.3, gain:.16, delay:i*.16, release:.15})); },
  };
})();

/* ============================= MUSIQUE D'AMBIANCE (nappe synthétisée, Web Audio) ============================= */
/* Une nappe discrète en fond continu, un peu comme un joueur de fond dans une soirée
   loup-garou : deux accords (nuit inquiétante / jour plus ouvert) et quelques notes
   éparses qui scintillent de temps en temps. 100% synthétisé, pas de fichier audio. */
const MUSIC = (function(){
  const BASE_VOL = 0.055; // volume d'ambiance, nettement sous la voix et les effets
  let playing = false;
  let enabled = true;
  let master = null;
  let padNodes = [];
  let mood = 'night';
  let sparkleTimer = null;

  const CHORDS = {
    night: [65.41, 77.78, 98.00, 116.54],   // C2 Eb2 G2 Bb2 — nappe mineure, inquiétante
    day:   [87.31, 110.00, 130.81, 164.81], // F2  A2  C3  E3  — plus ouverte, diurne
  };

  function ensureMaster(){
    const c = getAudioCtx();
    if(!c) return null;
    if(!master){
      master = c.createGain();
      master.gain.value = 0.0001;
      master.connect(c.destination);
    }
    return master;
  }

  function targetVolume(){ return enabled ? BASE_VOL : 0.0001; }

  function fadeMasterTo(v, dur){
    const c = getAudioCtx();
    const m = ensureMaster();
    if(!c || !m) return;
    const t0 = c.currentTime;
    m.gain.cancelScheduledValues(t0);
    m.gain.setValueAtTime(Math.max(m.gain.value, 0.0001), t0);
    m.gain.linearRampToValueAtTime(Math.max(v, 0.0001), t0 + dur);
  }

  function hardStopPad(){
    padNodes.forEach(n=>{ try{ n.osc.stop(); }catch(e){} });
    padNodes = [];
  }

  /* Reconstruit la nappe pour l'accord courant, en fondu enchaîné avec l'ancienne
     pour éviter tout clic audible au changement jour/nuit. */
  function startPad(){
    const c = getAudioCtx();
    const m = ensureMaster();
    if(!c || !m) return;
    const oldNodes = padNodes;
    padNodes = [];
    const t0 = c.currentTime;
    oldNodes.forEach(n=>{
      n.g.gain.cancelScheduledValues(t0);
      n.g.gain.setValueAtTime(n.g.gain.value, t0);
      n.g.gain.linearRampToValueAtTime(0.0001, t0 + 1.6);
      try{ n.osc.stop(t0 + 1.7); }catch(e){}
    });
    CHORDS[mood].forEach((f,i)=>{
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = i===0 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      g.gain.value = 0.0001;
      osc.connect(g); g.connect(m);
      osc.start();
      g.gain.linearRampToValueAtTime(1/(i+1.4), t0 + 1.8);
      padNodes.push({osc,g});
    });
  }

  /* Ponctue la nappe d'une note isolée de temps en temps, comme une étoile qui scintille. */
  function scheduleSparkle(){
    if(!playing) return;
    sparkleTimer = setTimeout(()=>{
      const c = getAudioCtx();
      const m = ensureMaster();
      if(c && m && playing){
        const freqs = CHORDS[mood];
        const f = freqs[Math.floor(Math.random()*freqs.length)] * 4;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        g.gain.value = 0.0001;
        osc.connect(g); g.connect(m);
        const t0 = c.currentTime;
        g.gain.linearRampToValueAtTime(0.5, t0 + 1.4);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.5);
        osc.start(t0); osc.stop(t0 + 4.6);
      }
      scheduleSparkle();
    }, 4200 + Math.random()*3800);
  }

  return {
    start(){
      if(playing) return;
      playing = true;
      startPad();
      fadeMasterTo(targetVolume(), 2.5);
      scheduleSparkle();
    },
    stop(){
      if(!playing) return;
      playing = false;
      if(sparkleTimer) clearTimeout(sparkleTimer);
      fadeMasterTo(0.0001, 1.4);
      setTimeout(hardStopPad, 1500);
    },
    setMood(m){
      if(mood===m) return;
      mood = m;
      if(playing){ startPad(); fadeMasterTo(targetVolume(), 2.2); }
    },
    setEnabled(v){
      enabled = v;
      if(playing) fadeMasterTo(targetVolume(), 1.2);
    },
    duck(){
      // Coupe quasi totalement la musique le temps que le narrateur parle,
      // pour que la voix reste toujours au premier plan.
      if(!playing) return;
      fadeMasterTo(0.0001, 0.15);
    },
    unduck(){
      if(!playing) return;
      fadeMasterTo(targetVolume(), 0.5);
    }
  };
})();

/* ============================= NARRATEUR (voix off, Web Speech API) ============================= */
/* Un "meneur de jeu" vocal qui annonce à voix haute les grandes étapes (réveil des rôles,
   morts du matin, résultats du vote, victoire...) pendant qu'on fait tourner l'appareil,
   comme le ferait un maître du jeu humain. */
const NARRATOR = (function(){
  const supported = 'speechSynthesis' in window;
  let enabled = supported; // activé par défaut si le navigateur le permet
  let lastText = '';
  let frVoice = null;

  function pickVoice(){
    if(!supported) return;
    const voices = window.speechSynthesis.getVoices();
    if(!voices || !voices.length) return;
    frVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('fr') && /female|femme|amelie|audrey|marie/i.test(v.name))
           || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('fr'))
           || null;
  }
  if(supported){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function setSpeakingUI(isSpeaking){
    const btn = document.getElementById('narration-toggle-btn');
    if(btn) btn.classList.toggle('is-speaking', !!isSpeaking);
  }

  function speak(text, onDone=null){
    if(!enabled || !supported || !text){
      if(typeof onDone === 'function') onDone();
      return;
    }
    if(text === lastText){
      if(typeof onDone === 'function') onDone();
      return;
    }
    lastText = text;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    if(frVoice) utter.voice = frVoice;
    utter.rate = 0.88;
    utter.pitch = 1.00;
    utter.volume = 1;
    let finished = false;
    const finish = ()=>{
      if(finished) return;
      finished = true;
      setSpeakingUI(false);
      MUSIC.unduck();
      if(typeof onDone === 'function') onDone();
    };
    utter.onstart = ()=>{ setSpeakingUI(true); MUSIC.duck(); };
    utter.onend = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
  }

  function speakThen(text, callback){
    speak(text, callback);
  }

  return {
    isSupported(){ return supported; },
    isEnabled(){ return enabled && supported; },
    setEnabled(v){
      enabled = v;
      if(!enabled && supported){ window.speechSynthesis.cancel(); setSpeakingUI(false); }
    },
    speak,
    speakThen,
    resetDedupe(){ lastText = ''; }
  };
})();

function updateNarrationButton(){
  const btn = document.getElementById('narration-toggle-btn');
  const icon = document.getElementById('narration-icon');
  if(!btn || !icon) return;
  if(!NARRATOR.isSupported()){
    btn.style.display = 'none';
    return;
  }
  icon.textContent = NARRATOR.isEnabled() ? '🗣️' : '🚫';
  btn.classList.toggle('is-active', NARRATOR.isEnabled());
  btn.setAttribute('aria-label', NARRATOR.isEnabled() ? 'Couper la narration vocale' : 'Activer la narration vocale');
}

/* Fait parler le narrateur uniquement si le texte a changé depuis le dernier appel,
   pour ne pas répéter la même phrase à chaque re-rendu de l'écran. */
function narrate(text){ NARRATOR.speak(text); }

/* Lance une narration puis change de vue uniquement quand la phrase est terminée.
   Le bouton "Continuer maintenant" reste disponible pour passer manuellement. */
function narrateThen(text, nextFn){
  NARRATOR.speakThen(text, nextFn);
}

function initials(name){
  const clean = (name||'').trim();
  if(!clean) return '?';
  const parts = clean.split(/\s+/);
  const s = parts.length>1 ? (parts[0][0]+parts[1][0]) : clean.slice(0,2);
  return s.toUpperCase();
}

/* ============================= COMPOSITION PAR DÉFAUT ============================= */
function defaultComposition(n){
  const loup = Math.max(1, Math.round(n/4.2));
  let remaining = n - loup;
  const comp = { loup, voyante:0, sorciere:0, chasseur:0, cupidon:0, tueur:0, villageois:0 };
  if(n>=5 && remaining>0){ comp.voyante=1; remaining--; }
  if(n>=6 && remaining>0){ comp.sorciere=1; remaining--; }
  if(n>=7 && remaining>0){ comp.chasseur=1; remaining--; }
  if(n>=8 && remaining>0){ comp.cupidon=1; remaining--; }
  comp.villageois = Math.max(0, remaining);
  return comp;
}

/* ============================= NUIT ============================= */
function buildNightQueue(){
  const q = [];
  if(!state.night.cupidonDone && state.players.some(p=>p.role==='cupidon' && p.alive)) q.push('cupidon');
  if(state.players.some(p=>p.role==='voyante' && p.alive)) q.push('voyante');
  if(aliveWolves().length>0) q.push('loup');
  const witch = state.players.find(p=>p.role==='sorciere' && p.alive);
  if(witch && !(state.night.witchHealUsed && state.night.witchPoisonUsed)) q.push('sorciere');
  return q;
}

function renderNight(){
  const step = state.nightQueue[state.nightIndex];

  if(state.view==='lovers-wake'){
    return renderLoversWake();
  }

  if(state.view==='sleep'){
    return renderPassScreen({
      icon:'😴',
      title: state.tmp.sleepTitleOverride || SLEEP_CUES[step] || 'Rendors-toi.',
      subtitle:'Ferme les yeux et passe l\'appareil. Le rôle suivant sera appelé une fois que le narrateur aura terminé...',
      auto:true,
      extra: `<button class="btn-ghost" data-action="confirm-sleep" style="margin-top:18px; width:100%;">Continuer maintenant</button>`
    });
  }

  if(!step){
    scheduleAutoResolve();
    return renderPassScreen({
      icon:'🌌',
      title:'La nuit s\'achève...',
      subtitle:'Le village se réveille dans un instant.',
      auto:true
    });
  }

  if(state.view!=='action'){
    // écran de passage
    let passLabel='';
    if(step==='cupidon') passLabel='Cupidon';
    if(step==='voyante') passLabel='la Voyante';
    if(step==='loup') passLabel='les Loups-Garous';
    if(step==='sorciere') passLabel='la Sorcière';
    const icons = {cupidon:'💘', voyante:'🔮', loup:'🐺', sorciere:'🧪'};
    return renderPassScreen({
      icon: icons[step],
      title:`Nuit ${state.round} — Passe l'appareil à`,
      name: passLabel,
      subtitle: step==='loup' ? 'Tous les loups se réveillent ensemble.' : 'Assure-toi que les autres joueurs ne regardent pas.',
      buttonLabel:'Je suis prêt(e)',
      action:'open-night-action'
    });
  }

  if(step==='cupidon') return renderCupidonAction();
  if(step==='voyante') return renderVoyanteAction();
  if(step==='loup') return renderLoupAction();
  if(step==='sorciere') return renderSorciereAction();
  return '';
}

function renderSorciereAction(){

      </button>
      <button class="btn-ghost" data-action="witch-open-poison" ${canPoison?'':'disabled'} style="text-align:left;">

/* ============================= JOUR ============================= */
function renderDay(){
  if(state.view==='hunter-shot'){
    return renderHunterShot();
  }
  if(state.view==='vote-result'){
    return renderVoteResult();
  }
  if(state.view==='deaths'){
    return renderDeathsReveal();
  }
  if(state.view==='vote'){
    return renderVoteScreen();
  }
  return renderDeathsReveal();
}

function renderDeathsReveal(){
  const deaths = state.lastDeaths;
  const body = deaths.length===0
    ? `<p class="center" style="font-size:1.05rem;">🕊️ Personne n'est mort cette nuit.</p>`
    : deaths.map(d=>`<p class="center" style="font-size:1.05rem;">☠️ <b>${esc(d.name)}</b> a été retrouvé(e) sans vie — <span class="muted small">${esc(ROLES[d.role].name)}</span></p>`).join('');
  return `
    <div class="sky">
      <div class="celestial"><div class="crater c1"></div><div class="crater c2"></div><div class="crater c3"></div></div>
      <span class="phase-label">☀️ Jour ${state.round}</span>
    </div>
    <div class="panel">${body}</div>
    <button class="btn-primary" data-action="go-to-vote">Passer au débat et au vote</button>
  `;
}

function renderVoteScreen(){
  const sel = state.tmp.voteSelection || null;
  const players = state.players.map(p=>`
    <div class="player-item ${p.alive?'':'dead'} ${sel===p.id?'selected':''}" ${p.alive?`data-action="vote-pick" data-id="${p.id}"`:''}>
      <span class="player-main"><span class="player-avatar">${initials(p.name)}</span><span class="player-name">${esc(p.name)}</span></span>

    <div class="sky">

      <span class="phase-label">☀️ Jour ${state.round} — Débat</span>
    </div>
    <div class="panel">
      <h3>Qui le village élimine-t-il ?</h3>
      <p class="small muted">Discutez à voix haute, puis désignez la personne votée par la majorité.</p>
      <div class="player-list">${players}</div>
    </div>

/* Révèle le rôle du joueur que le village vient d'éliminer par vote (et, le cas
   échéant, celui de son amoureux mort de chagrin dans la foulée). */
function renderVoteResult(){

/* ============================= LOGIQUE : ACTIONS ============================= */
function handleAction(action, el){
  switch(action){
    case 'show-rules': showModal(rulesModalHtml()); break;
    case 'close-modal': closeModal(); break;

    case 'n-inc': { state.tmp.n = Math.min(20, state.tmp.n+1); resizeNames(); state.tmp.comp = defaultComposition(state.tmp.n); render(); break; }
    case 'n-dec': { state.tmp.n = Math.max(5, state.tmp.n-1); resizeNames(); state.tmp.comp = defaultComposition(state.tmp.n); render(); break; }
    case 'name-input': { const idx = parseInt(el.dataset.idx); state.tmp.names[idx] = el.value; break; } // pas de re-render pour garder le focus

    case 'comp-inc': { const r=el.dataset.role; state.tmp.comp[r]++; render(); break; }
    case 'comp-dec': {
      const r=el.dataset.role;
      const min = (r==='villageois' || r==='loup') ? 1 : 0;
      state.tmp.comp[r]=Math.max(min,state.tmp.comp[r]-1);
      render(); break;
    }

    case 'start-game': SFX.gameStart(); startGame(); break;

    case 'reveal-role': SFX.chimeReveal(); state.view='card'; render(); break;
    case 'hide-role': state.revealIndex++; state.view='pass'; render(); break;
    case 'begin-first-night': SFX.howl(); beginNight(); render(); break;

    case 'open-night-action': {
      const step = state.nightQueue[state.nightIndex];
      if(step==='cupidon') SFX.sparkle();
      else if(step==='voyante') SFX.mystic();
      else if(step==='loup') SFX.howl();
      else if(step==='sorciere') SFX.bubble();
      state.view='action'; render(); break;
    }

    case 'cupidon-toggle': {
      const id = el.dataset.id;
      let sel = state.tmp.cupidonSelection || [];
      if(sel.includes(id)) sel = sel.filter(x=>x!==id);
      else if(sel.length<2) sel = [...sel, id];
      state.tmp.cupidonSelection = sel;
      render(); break;
    }
    case 'cupidon-confirm': {
      const [a,b] = state.tmp.cupidonSelection;
      getPlayer(a).lover = true; getPlayer(b).lover = true;
      state.night.loverIds = [a,b];
      state.night.cupidonDone = true;
      addLog(`Cupidon a uni ${getPlayer(a).name} et ${getPlayer(b).name} pour toujours.`);
      state.tmp.cupidonSelection = [];
      SFX.sparkle();
      finishNightStep();
      break;
    }

    case 'voyante-pick': { state.tmp.seerTargetId = el.dataset.id; state.tmp.seerRevealed=true; SFX.mystic(); render(); break; }
    case 'voyante-done': { state.tmp.seerRevealed=false; state.tmp.seerTargetId=null; finishNightStep(); break; }

    case 'wolf-pick': { state.tmp.wolfSelection = el.dataset.id; render(); break; }
    case 'wolf-confirm': {
      state.night.wolfTargetId = state.tmp.wolfSelection;
      state.tmp.wolfSelection = null;
      SFX.growl();
      finishNightStep();
      break;
    }

    case 'witch-heal': { state.night.witchHealTargetId = state.night.wolfTargetId; state.night.witchHealUsed = true; SFX.bubble(); render(); break; }
    case 'witch-open-poison': { state.tmp.witchSubview='poison'; render(); break; }
    case 'witch-back': { state.tmp.witchSubview=null; render(); break; }
    case 'poison-pick': { state.tmp.poisonSelection = el.dataset.id; render(); break; }
    case 'poison-confirm': {
      state.night.witchPoisonTargetId = state.tmp.poisonSelection;
      state.night.witchPoisonUsed = true;
      state.tmp.poisonSelection = null;
      state.tmp.witchSubview = null;
      SFX.bubble();
      render();
      break;
    }
    case 'witch-done': { state.tmp.witchSubview=null; finishNightStep(); break; }

    case 'confirm-sleep': skipPendingTransition(); break;

    case 'resolve-night': SFX.dawn(); resolveNight(); break;

    case 'hunter-pick': { state.tmp.hunterSelection = el.dataset.id; render(); break; }
    case 'hunter-confirm': {
      const shooter = state.pendingHunterShots.shift();
      const target = state.tmp.hunterSelection;
      const shotMsg = `En tombant, ${getPlayer(shooter).name} le Chasseur a tiré sur ${getPlayer(target).name}.`;
      addLog(`${getPlayer(shooter).name} (Chasseur) a tiré sur ${getPlayer(target).name} en tombant.`);
      state.tmp.hunterSelection = null;
      SFX.gunshot();
      narrate(shotMsg);
      const extra = processDeaths([target], 'chasseur');
      state.lastDeaths = state.lastDeaths.concat(extra.deaths);
      if(state.pendingHunterShots.length>0){
        render();
        break;
      }
      if(checkWinCondition()) break;
      if(state.tmp.hunterShotContext==='day'){
        startNewNightRound((state.tmp.voteNarration||'') + ' ' + shotMsg);
      } else {
        state.view = 'deaths';
        render();
      }
      break;
    }

    case 'go-to-vote': state.view='vote'; render(); break;
    case 'vote-pick': { state.tmp.voteSelection = el.dataset.id; SFX.voteTick(); render(); break; }
    case 'vote-confirm': {
      const target = state.tmp.voteSelection;
      const targetPlayer = getPlayer(target);
      const voteMsg = `Le village a voté pour éliminer ${targetPlayer.name}.`;
      const assassin = state.players.find(p=>p.role==='tueur' && p.alive);
      const contractCompleted = !!(assassin && assassin.targetId===targetPlayer.id);
      if(contractCompleted){
        assassin.nightImmunity = true;
        addLog(`${assassin.name} a rempli son contrat : ${targetPlayer.name} a été éliminé(e) par le village. Il/elle obtient une immunité contre la prochaine attaque de nuit.`);
      }
      addLog(voteMsg);
      state.tmp.voteSelection = null;
      SFX.elimination();
      const extra = processDeaths([target], 'vote');
      state.tmp.voteDeaths = extra.deaths;
      state.tmp.hunterShotContext = 'day';
      state.tmp.voteNarration = voteMsg;
      const revealMsg = extra.deaths.map(d=>`${d.name} était ${ROLES[d.role].name}.`).join(' ');
      narrate((voteMsg + ' ' + revealMsg).trim());
      state.view = 'vote-result';
      render();
      break;
    }
    case 'vote-result-continue': {
      if(state.pendingHunterShots.length>0){
        state.view='hunter-shot'; render();
      } else if(!checkWinCondition()){
        startNewNightRound(state.tmp.voteNarration);
      }
      break;
    }
    case 'vote-skip': {
      addLog('Le village n\'a réussi à éliminer personne aujourd\'hui.');
      startNewNightRound("Le village s'est abstenu, personne n'est éliminé aujourd'hui.");
      break;
    }

    case 'toggle-sound': {
      SFX.setEnabled(!SFX.isEnabled());
      MUSIC.setEnabled(SFX.isEnabled());
      if(SFX.isEnabled()) SFX.click();
      updateSoundButton();
      break;
    }
    case 'toggle-narration': {
      NARRATOR.setEnabled(!NARRATOR.isEnabled());
      NARRATOR.resetDedupe();
      updateNarrationButton();
      if(NARRATOR.isEnabled()) narrate('Très bien... À partir de maintenant, je serai la voix du village. Écoutez attentivement... et surtout... méfiez-vous de vos voisins.');
      break;
    }

    case 'new-game': state = freshState(); render(); break;
  }
}

function resizeNames(){
  const n = state.tmp.n;
  const arr = state.tmp.names || [];
  while(arr.length < n) arr.push('');
  arr.length = n;
  state.tmp.names = arr;
}

function showModal(html){
  let holder = document.getElementById('modal-holder');
  if(!holder){ holder = document.createElement('div'); holder.id='modal-holder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}
function closeModal(){
  const holder = document.getElementById('modal-holder');
  if(holder) holder.innerHTML='';
}

/* ============================= DÉMARRAGE DE PARTIE ============================= */
function startGame(){
  const n = state.tmp.n;
  const comp = state.tmp.comp;
  let roleBag = [];
  for(const [role,count] of Object.entries(comp)){
    for(let i=0;i<count;i++) roleBag.push(role);
  }
  // mélange (Fisher-Yates)
  for(let i=roleBag.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [roleBag[i],roleBag[j]] = [roleBag[j],roleBag[i]];
  }
  state.players = state.tmp.names.slice(0,n).map((name,i)=>({
    id: uid(),
    name: name.trim() || `Joueur ${i+1}`,
    role: roleBag[i],
    alive: true,
    lover: false,
    targetId: null,
    nightImmunity: false
  }));
  const assassin = state.players.find(p=>p.role==='tueur');
  if(assassin){
    const possibleTargets = state.players.filter(p=>p.id!==assassin.id);
    assassin.targetId = possibleTargets[Math.floor(Math.random()*possibleTargets.length)].id;
  }
  state.phase = 'reveal';
  state.revealIndex = 0;
  state.view = 'pass';
  addLog('La partie commence, les rôles ont été distribués.');
  render();
}

/* Annonce vocale du meneur de jeu au moment où l'appareil doit être passé au(x) prochain(s)
   joueur(s) concerné(s) par la nuit — imite ce que dirait un maître du jeu humain. */
const NIGHT_CUES = {
  cupidon: "La nuit tombe sur le village... Tout le monde ferme les yeux. ... Cupidon, réveille-toi doucement. Cette nuit, deux destins vont se croiser. Choisis les deux personnes qui seront liées par l’amour.",
  voyante: "Le village dort profondément... ... Voyante, ouvre les yeux. Les ténèbres cachent bien des secrets. Choisis une personne... et découvre de quel côté elle se trouve.",
  loup: "Dans le silence de la nuit... quelque chose se réveille. ... Loups-Garous, ouvrez les yeux. Retrouvez-vous dans l’ombre... et choisissez votre victime. Mais faites vite... avant que l’aube ne se lève.",
  sorciere: "Une lumière vacille dans la nuit... ... Sorcière, réveille-toi. Une vie est peut-être entre tes mains. Observe ce qui s’est passé... puis décide si tu utiliseras l’une de tes potions.",
};
function narrateNightCue(){
  const step = state.nightQueue[state.nightIndex];
  if(step && NIGHT_CUES[step]) narrate(NIGHT_CUES[step]);
  else narrate("La nuit touche à sa fin... Les dernières ombres se dissipent. Tout le monde peut refermer les yeux... car l’aube approche.");
}

/* Annonce dite au rôle qui vient d'agir, pour qu'il ait le temps de se rendormir
   avant de passer l'appareil au rôle suivant. */
const SLEEP_CUES = {
  cupidon: "C’est fait... Le destin est scellé. Cupidon, referme les yeux... et rendors-toi.",
  voyante: "Tu connais maintenant la vérité... ou du moins, une partie de la vérité. Voyante, referme les yeux... et rendors-toi.",
  loup: "Votre choix est fait... La nuit garde votre secret. Loups-Garous, refermez les yeux... et rendormez-vous.",
  sorciere: "Tes potions restent silencieuses... pour cette nuit. Sorcière, referme les yeux... et rendors-toi.",
};

/* Appelée quand un rôle vient de terminer son action : on marque une pause
   "rendors-toi" avant de passer au rôle suivant de la file de nuit.
   Cas particulier : après Cupidon, les deux amoureux se réveillent pour se
   découvrir, puis se rendorment à leur tour, avec le même délai qu'un rôle normal. */
function finishNightStep(){
  const step = state.nightQueue[state.nightIndex];
  state.tmp.sleepTitleOverride = null;
  state.view = 'sleep';

  const next = ()=>{
    if(state.phase!=='night') return;
    if(step==='cupidon' && state.night.loverIds && state.night.loverIds.length===2){
      wakeLovers();
    } else {
      advanceNightStep();
    }
  };

  render();

  // La vue "rendors-toi" apparaît immédiatement, mais l'étape suivante
  // n'arrive qu'après la fin complète de la phrase du narrateur.
  if(step && SLEEP_CUES[step]){
    state.tmp.voiceTransitionPending = true;
    narrateThen(SLEEP_CUES[step], ()=>{
      state.tmp.voiceTransitionPending = false;
      next();
    });
  } else {
    scheduleTimedTransition(next);
  }
}

/* Les amoureux se réveillent ensemble pour se découvrir, une fois Cupidon rendormi. */
function wakeLovers(){
  state.view = 'lovers-wake';
  narrate("Quelque part dans la nuit... deux cœurs battent désormais à l’unisson. ... Les amoureux, ouvrez les yeux. Regardez-vous... et souvenez-vous : le destin de l’un est désormais lié à celui de l’autre.");
  render();
  scheduleTimedTransition(sleepLovers);
}

/* Puis les amoureux se rendorment à leur tour, avant l'appel du rôle suivant. */
function sleepLovers(){
  state.tmp.sleepTitleOverride = 'Amoureux, rendormez-vous.';
  state.view = 'sleep';
  narrate('Le lien est créé... Rien ne pourra désormais l’effacer. Les amoureux, refermez les yeux... et rendormez-vous.');
  render();
  scheduleTimedTransition(advanceNightStep);
}

/* Délai laissé aux joueurs pour fermer les yeux et passer l'appareil, avant que
   l'étape suivante ne s'enchaîne toute seule — comme le ferait un meneur de jeu.
   La transition programmée peut être écourtée à tout moment via "Continuer maintenant". */
const SLEEP_DELAY_MS = 2800;
function scheduleTimedTransition(nextFn){
  state.tmp.sleepToken = (state.tmp.sleepToken||0) + 1;
  const token = state.tmp.sleepToken;
  state.tmp.pendingTransitionFn = nextFn;
  setTimeout(()=>{
    if(state.phase==='night' && state.tmp.sleepToken===token){
      state.tmp.pendingTransitionFn = null;
      nextFn();
    }
  }, SLEEP_DELAY_MS);
}
function skipPendingTransition(){
  const fn = state.tmp.pendingTransitionFn;
  if(fn){
    state.tmp.sleepToken = (state.tmp.sleepToken||0) + 1;
    state.tmp.pendingTransitionFn = null;
    fn();
    return;
  }

  // Si la voix est encore en train de parler, on l'interrompt uniquement
  // parce que le joueur a explicitement demandé de continuer.
  if(state.tmp.voiceTransitionPending){
    state.tmp.voiceTransitionPending = false;
    if('speechSynthesis' in window) window.speechSynthesis.cancel();

    const step = state.nightQueue[state.nightIndex];
    if(step==='cupidon' && state.night.loverIds && state.night.loverIds.length===2){
      wakeLovers();
    } else {
      advanceNightStep();
    }
  }
}

/* Une fois que plus personne ne doit agir, tout le monde dort : on ne peut pas
   compter sur un joueur pour cliquer, donc la résolution de la nuit se déclenche
   automatiquement après un court délai. */
function scheduleAutoResolve(){
  if(state.tmp.autoResolveScheduled) return;
  state.tmp.autoResolveScheduled = true;
  setTimeout(()=>{
    state.tmp.autoResolveScheduled = false;
    if(state.phase==='night' && !state.nightQueue[state.nightIndex]){
      SFX.dawn();
      resolveNight();
    }
  }, 3200);
}

function beginNight(){
  state.phase = 'night';
  state.nightQueue = buildNightQueue();
  state.nightIndex = 0;
  state.view = 'pass';
  state.tmp.autoResolveScheduled = false;
  const firstStep = state.nightQueue[0];
  const cue = firstStep && NIGHT_CUES[firstStep] ? ' ' + NIGHT_CUES[firstStep] : '';
  narrate("Le soleil disparaît à l’horizon... La nuit commence. Tout le monde ferme les yeux... et que le village s’endorme." + cue);
  render();
}

function advanceNightStep(){
  state.nightIndex++;
  state.view = 'pass';
  narrateNightCue();
  render();
}

function startNewNightRound(prefix){
  state.round++;
  state.night.wolfTargetId = null;
  state.night.witchHealTargetId = null;
  state.night.witchPoisonTargetId = null;
  state.phase = 'night';
  state.nightQueue = buildNightQueue();
  state.nightIndex = 0;
  state.view = 'pass';
  state.tmp.autoResolveScheduled = false;
  narrate((prefix ? prefix + " " : "") + "La nuit tombe à nouveau sur le village. Tout le monde ferme les yeux.");
  render();
}

/* ============================= RÉSOLUTION DE LA NUIT ============================= */
function resolveNight(){
  const deathsSet = new Set();
  const victim = state.night.wolfTargetId;
  const saved = victim && state.night.witchHealTargetId===victim;
  const victimPlayer = victim ? getPlayer(victim) : null;
  const shielded = !!(victimPlayer && victimPlayer.nightImmunity);
  if(victim && !saved && !shielded) deathsSet.add(victim);
  if(state.night.witchPoisonTargetId) deathsSet.add(state.night.witchPoisonTargetId);

  if(victim){
    if(shielded){
      victimPlayer.nightImmunity = false;
      addLog(`${victimPlayer.name} a été attaqué(e) par les loups, mais son immunité du Tueur à gages l'a protégé(e).`);
    } else {
      addLog(saved ? `Les loups ont attaqué ${victimPlayer.name}, mais la Sorcière l'a sauvé(e).` : `Les loups ont dévoré ${victimPlayer.name}.`);
    }
  } else {
    addLog('Les loups n\'ont attaqué personne.');
  }
  if(state.night.witchPoisonTargetId){
    addLog(`La Sorcière a empoisonné ${getPlayer(state.night.witchPoisonTargetId).name}.`);
  }

  const ids = Array.from(deathsSet);
  const extraInfo = processDeaths(ids, 'nuit');
  state.lastDeaths = extraInfo.deaths;
  if(extraInfo.deaths.length>0) setTimeout(()=>SFX.deathToll(), 450);

  const deathText = extraInfo.deaths.length===0
    ? "L’aube se lève lentement sur le village... Les portes s’ouvrent... les regards se croisent... Et pourtant... personne n’a disparu cette nuit."
    : "Le village se réveille. " + extraInfo.deaths.map(d=>`${d.name} a été retrouvé sans vie.`).join(' ');
  narrate(deathText);

  state.phase = 'day';
  state.tmp.hunterShotContext = 'night';
  state.view = state.pendingHunterShots.length>0 ? 'hunter-shot' : 'deaths';
  if(!checkWinCondition()){
    render();
  }
}

/* Applique une liste de morts, gère la chaîne des amoureux et met en file les tirs du chasseur.
   Retourne {deaths:[{id,name,role}]} pour affichage. */
function processDeaths(ids, cause){
  const newlyDead = [];
  let queue = [...ids];
  const seen = new Set();
  while(queue.length){
    const id = queue.shift();
    if(seen.has(id)) continue;
    seen.add(id);
    const p = getPlayer(id);
    if(!p || !p.alive) continue;
    p.alive = false;
    newlyDead.push({id:p.id, name:p.name, role:p.role});
    // chaîne amoureux
    if(p.lover){
      const otherLover = state.players.find(x=>x.lover && x.id!==p.id && x.alive);
      if(otherLover){
        addLog(`${otherLover.name}, fou/folle de chagrin après la mort de ${p.name}, en meurt à son tour.`);
        SFX.heartbreak();
        queue.push(otherLover.id);
      }
    }
    // chasseur
    if(p.role==='chasseur'){
      state.pendingHunterShots.push(p.id);
    }
  }
  return { deaths: newlyDead };
}

function goToVoteOrDeaths(){
  state.view = 'deaths';
  render();
}

/* ============================= CONDITIONS DE VICTOIRE ============================= */
function checkWinCondition(){
  const alive = alivePlayers();
  if(alive.length===2 && alive[0].lover && alive[1].lover){
    state.winner = 'amoureux';
    state.phase = 'end';
    SFX.victoryLovers();
    narrate('Le silence retombe... Il ne reste plus qu’eux deux. Malgré tout ce qui s’est passé... leur amour a survécu. Les amoureux remportent la partie... ensemble.');
    render();
    return true;
  }
  const wolves = aliveWolves();
  const others = alivePlayers().filter(p=>p.role!=='loup' && p.role!=='tueur');
  if(wolves.length===0){
    state.winner = 'village';
    state.phase = 'end';
    SFX.victoryVillage();
    narrate('Un dernier silence... puis le soulagement. Il n’y a plus aucun Loup-Garou parmi vous. Après cette longue nuit... le village est enfin sauvé !');
    render();
    return true;
  }
  if(wolves.length >= others.length){
    state.winner = 'loups';
    state.phase = 'end';
    SFX.victoryLoups();
    narrate('Le village n’a plus assez de forces pour résister... Les Loups-Garous sont désormais les plus nombreux. La nuit a gagné. ... Les Loups-Garous remportent la partie.');
    render();
    return true;
  }
  return false;
}

/* ============================= ÉCOUTEURS D'ÉVÉNEMENTS ============================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.dataset.action !== 'toggle-sound') SFX.click();
  handleAction(el.dataset.action, el);
});
document.addEventListener('input', (e)=>{
  if(e.target.matches('[data-action="name-input"]')){
    handleAction('name-input', e.target);
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  if(!e.target.matches('[data-action="name-input"]')) return;
  e.preventDefault();
  const idx = parseInt(e.target.dataset.idx);
  const next = document.querySelector(`[data-action="name-input"][data-idx="${idx+1}"]`);
  if(next) next.focus(); else e.target.blur();
});
/* Rend les lignes cliquables (player-item, etc.) accessibles au clavier :
   focus au tab, activation à Entrée/Espace, comme un vrai bouton. */
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest && e.target.closest('[data-action]');
  if(!el || el.tagName==='BUTTON' || el.tagName==='INPUT') return;
  e.preventDefault();
  el.click();
});
function enhanceClickableRows(){
  document.querySelectorAll('#app [data-action]').forEach(el=>{
    if(el.tagName==='BUTTON' || el.tagName==='INPUT') return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  });
}
/* Pousse la fenêtre en haut à chaque changement d'écran, pour ne pas laisser
   l'utilisateur au milieu d'un écran précédent après un scroll. */
function scrollAppToTop(){
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

/* ============================= INIT ============================= */
buildStars();
updateNarrationButton();
state = freshState();
render();
</script>
